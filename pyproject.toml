[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amini"
version = "0.1.0"
description = "The AminiFormer policy and the PPO building blocks of a Clash Royale AI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24,<2",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
